<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar HQ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Solar HQ</h1>
    <nav>
      <a id="login-btn">Login</a>
      <a id="commands-link" href="#">Commands</a>
      <a id="settingsBtn">Settings</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to Solar HQ</h2>
    <p>Your ultimate Discord companion.</p>
    <div class="actions">
      <button id="login-btn-hero">Login</button>
      <button id="invite-btn" class="invite">Invite Bot</button>
    </div>
  </section>

  <section class="features">
    <h3>Features</h3>
    <div class="feature-grid">
      <div class="feature">Fast and reliable</div>
      <div class="feature">Customizable commands</div>
      <div class="feature">24/7 uptime</div>
    </div>
  </section>

  <footer>
    Made by Solar © 2025
  </footer>

  <!-- Settings Panel -->
  <div id="settingsPanel">
    <h3>Settings</h3>

    <label for="themeColor">Theme Color</label>
    <input type="color" id="themeColor" />

    <label for="textColor">Text Color</label>
    <input type="color" id="textColor" />

    <label for="backgroundImage">Background Image</label>
    <input type="file" id="backgroundImage" accept="image/*" />

    <button id="resetSettings">Reset to Default</button>
    <button id="closeSettings">Close</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
